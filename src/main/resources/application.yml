server:
  port: 8766
  # Risposte compresse (gzip) se il browser le accetta: JSON dei movimenti e JavaScript
  # dell'interfaccia. Sotto i 2 KB non conviene.
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,text/javascript,application/javascript,text/plain,image/svg+xml
    min-response-size: 2KB

spring:
  application:
    name: contabilita
  datasource:
    # date_class=TEXT: sqlite-jdbc scriverebbe di default un LocalDateTime come intero
    # (epoch millis), ma hibernate-community-dialects lo rilegge come stringa formattata:
    # senza questo parametro la lettura di QUALSIASI colonna data scritta da Hibernate fallisce
    # ("Error parsing time stamp"). Con date_class=TEXT scrittura e lettura usano lo stesso formato.
    # busy_timeout=10000: se un'altra connessione sta scrivendo, aspetta fino a 10 s prima di
    # rispondere SQLITE_BUSY invece di fallire subito.
    url: jdbc:sqlite:${contabilita.dati}/contabilita.db?journal_mode=WAL&date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss.SSS&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite ha un solo scrittore alla volta: con piu' connessioni nel pool ognuna crede di
      # poter scrivere e si arriva comunque a SQLITE_BUSY. Con una sola connessione tutto
      # l'accesso al database - letture comprese - passa da un'unica coda: per il carico di
      # questo servizio (poche richieste al secondo da una rete locale) e' la scelta piu' robusta.
      maximum-pool-size: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # Fase 4: uno zip di fatture puo' pesare diverse decine di MB (i limiti sui file decompressi, al piu' 20 MB
      # per file e 200 MB in totale, meno se la memoria e' poca: 16 MB per file con -Xmx512m; li applica LettoreFile); gli allegati (foto, PDF) sono limitati a 8 MB
      # da AllegatiService. Questi sono i massimi: un'importazione accetta comunque non piu' di
      # contabilita.importa.lettura-massima, che segue la memoria del programma (vedi sotto).
      # I due limiti sono uguali apposta: oltre, GestoreErrori dice «massimo 120 MB per volta», vero per un file come per tanti.
      max-file-size: 120MB
      max-request-size: 120MB

contabilita:
  # Cartella dati: creata all'avvio se manca (vedi ContabilitaApplication.main). Sovrascrivibile
  # con la variabile d'ambiente CONTABILITA_DATA_DIR (l'installer usa ProgramData\Contabilita).
  dati: ${CONTABILITA_DATA_DIR:./data}
  cors:
    origine-sviluppo: http://localhost:5173
  importa:
    # Le anteprime dell'importazione tengono in memoria i file originali (da allegare alla conferma) fino a 30 minuti.
    # Tetto complessivo: quando una nuova anteprima lo fa superare si scartano le piu' vecchie (vedi ImportazioneService).
    # Vale il minimo fra questo valore e il 40% della memoria della JVM: l'installer avvia il servizio con -Xmx512m
    # (installer/Contabilita.xml), cioe' ~204 MB. Oltre i 204 MB alzarlo serve solo se si alza anche -Xmx.
    memoria-massima: 96MB
    # Quanto si accetta in UNA anteprima: la somma dei file caricati e la somma dei file letti (una volta estratti gli
    # zip). Vale il minimo fra questo valore e il 25% della memoria della JVM: con -Xmx512m sono 128 MB, con 256 MB 64.
    # Oltre: «I file scelti sono troppo grandi tutti insieme (massimo N MB per volta)».
    lettura-massima: 200MB

logging:
  # Console e file in UTF-8 (la console di Windows usa una codepage che rovina le accentate).
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: ${contabilita.dati}/log/contabilita.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  pattern:
    # Difesa in piu' rispetto a PerLog.pulisci (che pulisce i valori del cliente dove si scrivono): un messaggio non puo'
    # comunque cominciare una riga nuova. Ogni a capo dentro il messaggio (CR LF, CR, LF, tabulazione verticale, salto
    # pagina, NEL, separatori di riga e di paragrafo Unicode) diventa il testo \n (barra e n): un evento sta su una riga
    # sola, e nel file su Windows non si mescolano LF e CRLF. Vale per console e file, e solo per il messaggio: le righe
    # dell'eccezione sotto le tiene pulite PerLog.conStack.
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %replace(%msg){'\\r\\n|[\\r\\n\\u000B\\u000C\\u0085\\u2028\\u2029]', '\\\\n'}%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p --- [%t] %-40.40logger{39} : %replace(%msg){'\\r\\n|[\\r\\n\\u000B\\u000C\\u0085\\u2028\\u2029]', '\\\\n'}%n"
